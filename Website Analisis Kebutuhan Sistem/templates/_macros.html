{# Ikon SVG dan logo SIKARA (pengganti komponen Icon dan Brand di React). #}
{% macro icon(name, cls="size-5", id=None) -%}
<svg {% if id %}id="{{ id }}" {% endif %}aria-hidden="true" class="{{ cls }}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  {%- if name == "arrow" %}<path d="M5 12h14m-5-5 5 5-5 5" />
  {%- elif name == "check" %}<path d="m5 12 4 4L19 6" />
  {%- elif name == "chevron" %}<path d="m9 18 6-6-6-6" />
  {%- elif name == "clock" %}<circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
  {%- elif name == "document" %}<path d="M6 3h8l4 4v14H6z" /><path d="M14 3v5h5M9 13h6M9 17h5" />
  {%- elif name == "eye" %}<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" /><circle cx="12" cy="12" r="2.5" />
  {%- elif name == "file" %}<path d="M7 3h7l4 4v14H7z" /><path d="M14 3v5h5" />
  {%- elif name == "folder" %}<path d="M3 7h7l2 2h9v10H3z" />
  {%- elif name == "grid" %}<rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" />
  {%- elif name == "help" %}<circle cx="12" cy="12" r="9" /><path d="M9.5 9a2.6 2.6 0 1 1 4.2 2c-1 .7-1.7 1.2-1.7 2.5M12 17h.01" />
  {%- elif name == "menu" %}<path d="M4 7h16M4 12h16M4 17h16" />
  {%- elif name == "close" %}<path d="M6 6l12 12M18 6 6 18" />
  {%- elif name == "lock" %}<rect x="5" y="10" width="14" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
  {%- elif name == "logout" %}<path d="M10 5H5v14h5m5-4 4-3-4-3m4 3H9" />
  {%- elif name == "plus" %}<path d="M12 5v14M5 12h14" />
  {%- elif name == "search" %}<circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
  {%- elif name == "settings" %}<circle cx="12" cy="12" r="3" /><path d="M19 13.5a7 7 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2.6-1.5L13.7 2h-4l-.3 3a7 7 0 0 0-2.6 1.5l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 3l-2 1.5 2 3.5 2.4-1A7 7 0 0 0 9.4 19l.3 3h4l.3-3a7 7 0 0 0 2.6-1.5l2.4 1 2-3.5Z" />
  {%- elif name == "sparkles" %}<path d="m12 3 1.2 3.3L16.5 8l-3.3 1.7L12 13l-1.2-3.3L7.5 8l3.3-1.7L12 3Z" /><path d="m18.5 14 .7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8ZM5 13l.8 2.2L8 16l-2.2.8L5 19l-.8-2.2L2 16l2.2-.8L5 13Z" />
  {%- elif name == "upload" %}<path d="M12 16V4m-4 4 4-4 4 4" /><path d="M5 14v6h14v-6" />
  {%- elif name == "user" %}<circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" />
  {%- endif %}
</svg>
{%- endmacro %}

{% macro brand(light=false, name="SIKARA") -%}
<div class="flex items-center gap-3">
  <div class="relative flex size-10 items-center justify-center rounded-xl bg-brand text-white shadow-logo">
    {{ icon("sparkles", "size-6") }}
  </div>
  <div class="text-xl font-bold tracking-tight {{ 'text-white' if light else 'text-ink' }}">{{ name }}</div>
</div>
{%- endmacro %}
